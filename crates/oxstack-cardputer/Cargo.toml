[package]
name         = "oxstack-cardputer"
description  = "Board support for the M5Stack Cardputer ADV on esp-hal + Embassy"
keywords     = ["embedded", "no-std", "esp32s3", "cardputer", "m5stack"]
categories   = ["embedded", "no-std", "hardware-support"]
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[features]
# Radio support: a heap in reclaimed bootloader RAM plus esp-radio.
# The reclaimed region is the ESP-IDF bootloader's RAM, hence that dependency.
radio = ["dep:esp-radio", "dep:esp-alloc", "dep:esp-bootloader-esp-idf", "esp-rtos/esp-radio", "esp-rtos/esp-alloc"]
wifi  = ["radio", "esp-radio/wifi", "dep:embassy-net", "dep:embassy-executor", "dep:embassy-futures", "dep:oxstack-net"]
ble   = ["radio", "esp-radio/ble", "dep:trouble-host", "dep:bt-hci"]
defmt = [
    "dep:defmt",
    "esp-hal/defmt",
    "embassy-embedded-hal/defmt",
    "esp-radio?/defmt",
    "embedded-sdmmc/defmt-log",
    "esp-alloc?/defmt",
    "embassy-net?/defmt",
    "oxstack-net?/defmt",
    "trouble-host?/defmt",
    "oxstack-drivers/defmt",
    "oxstack-gfx/defmt",
    "oxstack-audio/defmt",
    "oxstack-ir/defmt",
    "oxstack-input/defmt",
]

[dependencies]
oxstack-drivers = { workspace = true, features = ["tca8418", "st7789", "bmi270", "es8311"] }
oxstack-gfx     = { workspace = true }
oxstack-audio   = { workspace = true }
oxstack-ir      = { workspace = true }
oxstack-input   = { workspace = true }

esp-hal              = { workspace = true }
esp-rtos             = { workspace = true }
embassy-time         = { workspace = true }
embassy-sync         = { workspace = true }
embassy-embedded-hal = { workspace = true }
embedded-hal         = { workspace = true }
embedded-hal-async   = { workspace = true }
embedded-hal-bus     = { workspace = true }
static_cell          = { workspace = true }
embedded-sdmmc       = { workspace = true }
defmt                = { workspace = true, optional = true }
esp-radio            = { workspace = true, optional = true }
esp-alloc            = { workspace = true, optional = true }
esp-bootloader-esp-idf = { workspace = true, optional = true }
embassy-net          = { workspace = true, optional = true }
embassy-executor     = { workspace = true, optional = true }
embassy-futures      = { workspace = true, optional = true }
oxstack-net          = { workspace = true, optional = true }
trouble-host         = { workspace = true, optional = true }
bt-hci               = { workspace = true, optional = true }
